name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Exécuter en mode simulation
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing secret SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing secret SUPABASE_DB_PASSWORD" && exit 1)
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing secret SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing secret SUPABASE_SERVICE_ROLE_KEY" && exit 1)

      - name: Dry run deploy
        if: ${{ inputs.dry_run }}
        run: npm run supabase:deploy:dry-run

      - name: Deploy Supabase
        if: ${{ !inputs.dry_run }}
        run: npm run supabase:deploy