<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo Feuille et fourchette">
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f2ea"/>
    </linearGradient>
    <linearGradient id="p4-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34a870"/>
      <stop offset="1" stop-color="#1f7a4a"/>
    </linearGradient>
    <linearGradient id="p4-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a4d7a"/>
      <stop offset="1" stop-color="#2d9561"/>
    </linearGradient>
  </defs>

  <!-- Fond blanc + anneau bicolore -->
  <circle cx="256" cy="256" r="240" fill="url(#p4-bg)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#p4-ring)" stroke-width="10"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#e8a419" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Grande feuille -->
  <path d="M 176 336 C 176 200, 296 128, 400 128 C 400 232, 328 352, 200 352 C 190 352, 180 348, 176 336 Z"
        fill="url(#p4-leaf)"/>
  <!-- Nervure centrale -->
  <path d="M 200 344 C 260 300, 320 240, 390 148"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <!-- Nervures secondaires -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 230 320 L 250 296"/>
    <path d="M 260 288 L 288 258"/>
    <path d="M 296 250 L 328 216"/>
    <path d="M 336 208 L 366 178"/>
  </g>

  <!-- Fourchette-cuillère minimaliste croisée -->
  <g transform="translate(112 396) rotate(-38)">
    <!-- Manche -->
    <rect x="-6" y="-140" width="12" height="140" rx="6" fill="#1a4d7a"/>
    <!-- Dents de la fourchette -->
    <rect x="-24" y="-200" width="6" height="70" rx="3" fill="#1a4d7a"/>
    <rect x="-9"  y="-208" width="6" height="78" rx="3" fill="#1a4d7a"/>
    <rect x="6"   y="-208" width="6" height="78" rx="3" fill="#1a4d7a"/>
    <rect x="21"  y="-200" width="6" height="70" rx="3" fill="#1a4d7a"/>
  </g>

  <!-- Petite goutte dorée = don -->
  <path d="M 384 344 C 384 328, 400 316, 400 300 C 400 316, 416 328, 416 344 C 416 358, 402 366, 400 366 C 398 366, 384 358, 384 344 Z"
        fill="#e8a419"/>
</svg>
